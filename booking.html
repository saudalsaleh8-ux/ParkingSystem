<!DOCTYPE html>

<html lang="en">

<head>

    <title>Booking - Parking System</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <h1>Book a Parking Space</h1>

    <form id="bookingForm" name="bookingForm">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name">

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <br><br>

        <label for="phone">Phone:</label>
        <input type="text" id="phone" name="phone">

        <br><br>

        <label for="parkingID">Parking ID:</label>
        <input type="text" id="parkingID" name="parkingID">

        <br><br>

        <label for="date">Booking Date:</label>
        <input type="text" id="date" name="date">

        <br><br>

        <input type="submit" value="Book Parking">

    </form>

    <br>

    <a href="parking.html">View Parking Spaces</a>

    <br><br>

    <a href="index.html">Back to Home</a>

</body>

</html>
